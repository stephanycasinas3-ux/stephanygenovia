<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="ghfv.js"></script>
        <title>Document</title>
    </head>
    <body>
        <div class="flex">
            <div class="flex-1 bg-gray h-screen items-center justify-center p-20">
                <div class="mt-36">
                    <img src="images.jpg" alt="" class="w-20 h-20 mx-auto">
                </div>
                <div class="mb-4">
                    <h1 class="text-2xl font-bold">Login</h1>
                </div>
                <div>
                    <input type="text" name="" id="" class="w-full rounded-xl border py-3 pl-10 pr-4 text-sm outline-none transition-all duration-200 foocus:ring-2" placeholder="Username">
                </div>
                <div class="mt-4">
                    <input type="password" name="" id="" class="w-full rounded-xl border py-3 pl-10 pr-4 text-sm outline-none transition-all duration-200 foocus:ring-2" placeholder="Password">
                </div>
                <div class="mt-4">
                    <button class="w-full bg-blue-500 text-white p-2 mt-2 rounded-xl">Login</button>
                </div>
            </div>
            <div id="box" class="flex-1 bg-purple-500 h-screen p-5 flex items-center justify-center">
                <p class="text-white text-xl font-bold" id="msg">Welcome to the purple world!</p>
                <div class="m-5">
                    <button id="btn" class="bg-screen-500 text-white p-2 rounded hover:bg-green-600 transition-colors duration-200">Click me</button>
                    <button id="colorBtn" class="bg-yellow-500 text-white p-2 rounded hover:bg-yellow-600 transition-colors duration-200">Change Color</button>
                </div>
            </div>
        </div>
    </body>
</html>
